<div class="auth-container">
  <div class="auth-background">
    <div class="auth-content">
      <div class="auth-header">
        <div class="logo-section">
          <mat-icon class="logo-icon">science</mat-icon>
          <h1 class="logo-text">Chemical Compounds</h1>
        </div>
        <h2 class="auth-title">Forgot Password</h2>
        <p class="auth-subtitle">Enter your email address and we'll send you a reset link</p>
      </div>

      <mat-card class="auth-card">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" placeholder="Enter your email address" type="email" />
            <mat-icon matSuffix>email</mat-icon>
            <mat-error *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
              <mat-icon class="error-icon">error</mat-icon>
              Email is required
            </mat-error>
            <mat-error *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
              <mat-icon class="error-icon">error</mat-icon>
              Please enter a valid email address
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading" class="auth-button">
            <mat-icon *ngIf="!loading">send</mat-icon>
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            {{ loading ? 'Sending Reset Link...' : 'Send Reset Link' }}
          </button>
        </form>

        <div class="auth-footer">
          <p class="info-message" *ngIf="message">{{ message }}</p>
          <p class="error-message" *ngIf="error">{{ error }}</p>
          <div class="auth-links">
            <a routerLink="/login" class="auth-link">
              <mat-icon>arrow_back</mat-icon>
              Back to Login
            </a>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
</div>
