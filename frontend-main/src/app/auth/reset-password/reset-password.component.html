<div class="auth-container">
  <div class="auth-background">
    <div class="auth-content">
      <div class="auth-header">
        <div class="logo-section">
          <mat-icon class="logo-icon">science</mat-icon>
          <h1 class="logo-text">Chemical Compounds</h1>
        </div>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Enter your new password below</p>
      </div>

      <mat-card class="auth-card">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>New Password</mat-label>
            <input matInput [type]="'password'" formControlName="newPassword" placeholder="Enter your new password" />
            <mat-icon matSuffix>lock</mat-icon>
            <mat-error *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('required')">
              <mat-icon class="error-icon">error</mat-icon>
              Password is required
            </mat-error>
            <mat-error *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.hasError('pattern')">
              <mat-icon class="error-icon">error</mat-icon>
              Password must be 6-12 characters with uppercase, digit, and special character
            </mat-error>
          </mat-form-field>

          <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading || !token" class="auth-button">
            <mat-icon *ngIf="!loading">lock_reset</mat-icon>
            <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
            {{ loading ? 'Resetting Password...' : 'Reset Password' }}
          </button>
        </form>

        <div class="auth-footer">
          <p class="info-message" *ngIf="message">{{ message }}</p>
          <p class="error-message" *ngIf="error">{{ error }}</p>
          <div class="auth-links">
            <a routerLink="/login" class="auth-link">
              <mat-icon>arrow_back</mat-icon>
              Back to Login
            </a>
          </div>
        </div>
      </mat-card>
    </div>
  </div>
</div>
